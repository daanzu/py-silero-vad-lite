name: Build and upload to PyPI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, develop]
    tags: ['v*']
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build_sdist:
    name: Build and inspect source distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: python -m pip install build
      - run: python -m build --sdist
      - run: python scripts/check_sdist.py dist/*.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build_wheels:
    name: Build and test wheels (${{ matrix.os }})
    needs: build_sdist
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15-intel, macos-15]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: cibw-sdist
          path: source-dist
      - name: Select the exact source archive
        id: sdist
        shell: bash
        run: |
          files=(source-dist/*.tar.gz)
          test "${#files[@]}" -eq 1
          echo "path=${files[0]}" >> "$GITHUB_OUTPUT"
      - name: Build wheels from the release source archive
        uses: pypa/cibuildwheel@e090b81e30c4d855ea63bf4b6e59204c09a101ae # v4.2.1
        with:
          package-dir: ${{ steps.sdist.outputs.path }}
        env:
          # Explicitly exclude free-threaded variants and untested interpreters.
          CIBW_BUILD: 'cp310-* cp311-* cp312-* cp313-* cp314-*'
          CIBW_SKIP: '*-musllinux_*'
          # Native ONNX Runtime archives support x64 Linux/Windows and both Macs.
          CIBW_ARCHS: native
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
          MACOSX_DEPLOYMENT_TARGET: '11.0'
          SYSTEM_VERSION_COMPAT: '0'
          CIBW_TEST_COMMAND: python -m pytest {package}/tests
          CIBW_TEST_EXTRAS: dev
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cibw-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  test_source_install:
    name: Install source archive (Python ${{ matrix.python }})
    needs: build_sdist
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: cibw-sdist
          path: dist
      - name: Install and test the exact source archive outside the checkout
        shell: bash
        run: |
          python -m pip install dist/*.tar.gz pytest
          mkdir extracted
          tar -xzf dist/*.tar.gz -C extracted
          cd "$RUNNER_TEMP"
          python -m pytest "$GITHUB_WORKSPACE"/extracted/*/tests

  upload_pypi:
    needs: [build_wheels, build_sdist, test_source_install]
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    # Pull requests and manual dispatches only build/test artifacts.
    if: (github.event_name == 'release' && github.event.action == 'published') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
